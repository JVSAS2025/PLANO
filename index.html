<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ocupación - Minibodegas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Control de Minibodegas - JVStorage</h1>
        <p>Haz clic en una bodega para cambiar su estado (Libre / Ocupada / Reservada)</p>
    </header>

    <div class="container">
        <!-- Panel de estadísticas -->
        <div class="stats">
            <span class="badge libre">Libres: <strong id="countLibres">0</strong></span>
            <span class="badge ocupada">Ocupadas: <strong id="countOcupadas">0</strong></span>
            <span class="badge reservada">Reservadas: <strong id="countReservadas">0</strong></span>
        </div>

        <!-- Contenedor del plano -->
        <div class="plano-container">
            <img src="plano.JPG" alt="Plano de Minibodegas" id="imagenPlano">
            <div id="gridBodegas"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
